name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse
          if (!(Test-Path "src/ImageDownloaderHPA.py")) { throw "Missing src/ImageDownloaderHPA.py" }
          if (!(Test-Path "assets")) { throw "Missing assets folder" }
          if (!(Test-Path "assets/icons/hpa_jjrr_icon.ico")) { throw "Missing Windows .ico icon" }

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --windowed `
            --onefile `
            --name "ImageDownloaderHPA-v1.3-windows" `
            --icon "assets/icons/hpa_jjrr_icon.ico" `
            --add-data "assets;assets" `
            src/ImageDownloaderHPA.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageDownloaderHPA-v1.3-windows
          path: dist/ImageDownloaderHPA-v1.3-windows.exe


  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify files
        run: |
          ls -R
          test -f src/ImageDownloaderHPA.py
          test -d assets
          test -f assets/icons/hpa_jjrr_icon.icns

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --onedir \
            --name "HPA Downloader" \
            --icon "assets/icons/hpa_jjrr_icon.icns" \
            --add-data "assets:assets" \
            src/ImageDownloaderHPA.py

      - name: Zip macOS app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "HPA Downloader.app" "HPA-Downloader-v1.3-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: HPA-Downloader-v1.3-macOS
          path: dist/HPA-Downloader-v1.3-macOS.zip


  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify files
        run: |
          ls -R
          test -f src/ImageDownloaderHPA.py
          test -d assets

      - name: Build Linux executable
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --onefile \
            --name "ImageDownloaderHPA-v1.3-linux" \
            --add-data "assets:assets" \
            src/ImageDownloaderHPA.py

      - name: Make Linux executable
        run: |
          chmod +x dist/ImageDownloaderHPA-v1.3-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageDownloaderHPA-v1.3-linux
          path: dist/ImageDownloaderHPA-v1.3-linux